name: copy_cat
description: "Mimic Party — offline local-LAN voice mimic game."
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + navigation (flutter-patterns skill, same as ../flutter_application_1)
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # LAN discovery (PLAN asks bonsoir ^5 — API changed, use v7)
  bonsoir: ^7.1.5

  # Audio: record ^7 is proven on this machine in ../flutter_application_1.
  # (PLAN also asks just_audio + file_picker, but their Android artifacts are
  # unreachable offline — playback/pick use framework APIs via NativeAudio.)
  record: ^7.1.1

  # System & utils
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  vector_math: ^2.4.0
  permission_handler: 12.0.0
  http: 1.6.0
  shared_preferences: 2.5.5
  flutter_scene: ^0.24.0

  # NOTE: PLAN lists pitchupdart ^0.1.2 for YIN pitch detection, but pub.dev
  # has only pitchupdart 0.0.6 (guitar-note classifier, not YIN) — so pitch
  # extraction is implemented locally in lib/services/pitch_extractor.dart
  # (50 ms RMS + zero-crossing, no extra dependency).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.10.1

flutter:
  uses-material-design: true

  # Tiny synthesized UI sounds (see tool temp gen_sfx.dart).
  assets:
    - assets/sfx/
    - assets/logo/
    - assets/sprite_play_normal.png
    - assets/sprite_play_pressed.png
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
