org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disabled: Kotlin incremental cache cannot relativize plugin sources on C:\
# (pub cache) against this project on D:\ — daemon fails closing the cache.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# The local network resets some HTTPS connections mid-artifact-download.
# Retry each repository request a few extra times before failing over.
org.gradle.internal.repository.max.retries=10
