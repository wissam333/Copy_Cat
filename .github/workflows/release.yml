name: release

# Builds the release APK and attaches it to a GitHub release.
# Trigger: push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`
on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Match the local dev version (Dart 3.13.2). flutter_scene needs 3.47+.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # hook/build.dart regenerates flutter_scene_generated/ shader bundles.
      - run: flutter build apk --release

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
